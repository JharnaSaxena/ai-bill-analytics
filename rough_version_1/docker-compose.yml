name: de-project

x-spark: &spark
  image: apache/spark:3.5.1
  volumes:
    - ./jobs:/opt/jobs:ro
    - ./data:/opt/data
    - ./data/checkpoints:/opt/checkpoints

services:

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    hostname: kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 30s
      retries: 15
      start_period: 30s

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists
        --topic llm-usage-events --partitions 3 --replication-factor 1
        --config retention.ms=604800000 --config retention.bytes=-1 &&
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists
        --topic llm-provider-reports --partitions 3 --replication-factor 1
        --config retention.ms=604800000 --config retention.bytes=-1

  spark-master:
    <<: *spark
    hostname: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host spark-master
    ports:
      - "127.0.0.1:8080:8080"

  spark-worker:
    <<: *spark
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --cores 2 --memory 2g
    ports:
      - "127.0.0.1:8081:8081"

  postgres:
    image: postgres:15.7
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:11.1.0
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      POSTGRES_DB: ${POSTGRES_DB}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

  producer:
    profiles: ["apps"]
    build: ./producer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      TOPIC: llm-usage-events
      DATA_DIR: /opt/data
      RATE_PER_SEC: ${RATE_PER_SEC:-50}
      DURATION_SEC: ${DURATION_SEC:-0}
      DUPLICATE_RATE: ${DUPLICATE_RATE:-0.02}
      LATE_RATE: ${LATE_RATE:-0.02}
      BAD_RATE: ${BAD_RATE:-0.005}
      PROVIDER_RATE: ${PROVIDER_RATE:-0.25}
      OFFICE_TZ: ${OFFICE_TZ:-Asia/Kolkata}
      RESPECT_BUSINESS_HOURS: ${RESPECT_BUSINESS_HOURS:-false}
    volumes:
      - ./data:/opt/data

  stream-job:
    <<: *spark
    profiles: ["apps"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      spark-worker:
        condition: service_started
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: >
      /opt/spark/bin/spark-submit --master spark://spark-master:7077
      --conf spark.jars.ivy=/tmp/.ivy
      --conf spark.sql.shuffle.partitions=4
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,org.postgresql:postgresql:42.7.3
      /opt/jobs/stream_job.py

  batch-scheduler:
    <<: *spark
    profiles: ["apps", "lambda"]
    depends_on:
      postgres:
        condition: service_healthy
      spark-worker:
        condition: service_started
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DATA_DIR: /opt/data
    command: >
      /opt/spark/bin/spark-submit --master spark://spark-master:7077
      --conf spark.jars.ivy=/tmp/.ivy
      --conf spark.sql.shuffle.partitions=4
      --packages org.postgresql:postgresql:42.7.3
      /opt/jobs/batch_job.py

volumes:
  kafka-data:
  pg-data:
  grafana-data: