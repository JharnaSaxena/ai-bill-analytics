apiVersion: 1
datasources:
  - name: AI Bill Postgres
    uid: ai-bill-pg
    type: postgres
    access: proxy
    url: postgres:5432
    database: $__env{POSTGRES_DB}
    user: grafana_ro
    secureJsonData:
      password: $__env{GRAFANA_DB_PASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 1500
      timescaledb: false
    isDefault: true
    editable: false